<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ÔZAnnonces — App</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f97316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ÔZAnnonces">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
<style>
:root{
  --orange:#f97316; --orange-dark:#ea580c; --bg:#faf9f7; --card:#ffffff;
  --text:#1f2937; --muted:#8b8f99; --border:#eee;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
body{display:flex;justify-content:center;}
#phone{width:100%;max-width:430px;min-height:100vh;background:var(--bg);
  display:flex;flex-direction:column;position:relative;overflow:hidden;}

/* Header */
header{padding:14px 20px 14px;background:linear-gradient(180deg,#fff7ed 0%,#ffffff 100%);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;
  box-shadow:0 2px 8px -4px rgba(0,0,0,.06);}
.logo{font-size:20px;font-weight:800;letter-spacing:.3px;margin-bottom:8px;text-align:left;}
.logo span{text-shadow:0 3px 5px rgba(0,0,0,.32);}
.logo .o{color:#2563eb;} .logo .z{color:#111827;} .logo .a{color:#dc2626;} .logo .rest{color:#111827;}
header .greet{font-size:17px;font-weight:700;}
header .sub{color:var(--muted);font-size:14px;margin-top:2px;}

/* Screens */
.screen{display:none;flex:1;overflow-y:auto;padding:16px 16px 90px;}
.screen.active{display:block;}

/* Search */
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);
  border-radius:16px;padding:14px 16px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.search input{border:none;outline:none;flex:1 1 0;min-width:0;width:0;font-size:15px;background:transparent;}
.search{box-sizing:border-box;max-width:100%;gap:8px;}
.search .btn{white-space:nowrap;}
.search > span{font-size:18px;}
.search .btn.small{font-size:13.5px;font-weight:700;font-family:inherit;line-height:1.2;}
.search .btn span{font:inherit;}

/* Category grid */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px;}
.cat{background:#fff;border-radius:16px;padding:14px 6px;text-align:center;
  border:1px solid var(--border);cursor:pointer;transition:transform .1s;}
.cat:active{transform:scale(.95);}
.cat .ico{font-size:24px;margin-bottom:6px;}
.cat .lab{font-size:10px;color:var(--muted);font-weight:600;line-height:1.25;}

h3.section{font-size:16px;margin:0 0 12px;font-weight:700;}

/* Ad cards */
.ad-list{display:flex;flex-direction:column;gap:12px;}
.ad-card{background:#fff;border-radius:18px;border:1px solid var(--border);overflow:hidden;
  display:flex;gap:12px;padding:10px;cursor:pointer;transition:transform .1s;}
.ad-card:active{transform:scale(.98);}
.ad-thumb{width:76px;height:76px;border-radius:14px;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-size:28px;color:#fff;overflow:hidden;}
.ad-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.ad-info{flex:1;min-width:0;}
.ad-title{font-weight:700;font-size:14.5px;margin-bottom:3px;}
.ad-price{color:var(--orange-dark);font-weight:800;font-size:15px;}
.ad-loc{color:var(--muted);font-size:12px;margin-top:4px;}

.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px;}
.chip{flex-shrink:0;padding:8px 16px;border-radius:999px;background:#fff;border:1px solid var(--border);
  font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;}
.chip.on{background:var(--orange);color:#fff;border-color:var(--orange);}

/* OZAMarket */
.oza-box{background:linear-gradient(135deg,#8b5cf6,#6d28d9);border-radius:20px;padding:16px 0 14px;margin-bottom:22px;color:#fff;
  box-shadow:0 8px 20px -6px rgba(109,40,217,.45);}
.oza-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;margin-bottom:12px;cursor:pointer;}
.oza-head .tt{font-weight:800;font-size:17px;}
.oza-head .ss{font-size:12px;opacity:.9;margin-top:2px;}
.oza-head .all{background:rgba(255,255,255,.2);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;white-space:nowrap;}
.oza-scroll{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none;}
.oza-scroll::-webkit-scrollbar{display:none;}
.oza-tile{flex:0 0 84px;background:#fff;color:var(--text);border-radius:16px;padding:12px 6px;text-align:center;cursor:pointer;transition:transform .1s;}
.oza-tile:active{transform:scale(.94);}
.oza-tile .ico{font-size:26px;margin-bottom:6px;}
.oza-tile .lab{font-size:10.5px;font-weight:700;line-height:1.25;color:#4c1d95;}
.subchips{display:flex;gap:8px;overflow-x:auto;margin:-6px 0 16px;padding-bottom:2px;scrollbar-width:none;}
.subchips:empty{display:none;}
.subchip{flex-shrink:0;padding:6px 13px;border-radius:999px;background:#f5f3ff;border:1px solid #ddd6fe;font-size:12.5px;font-weight:600;color:#6d28d9;cursor:pointer;}
.subchip.on{background:#8b5cf6;color:#fff;border-color:#8b5cf6;}
.cat.oza{border-color:#8b5cf6;}

/* CTA banner */
.banner{position:relative;overflow:hidden;background:linear-gradient(135deg,#fb923c,#dc2626);border-radius:20px;
  padding:22px;color:#fff;margin-bottom:22px;box-shadow:0 8px 20px -6px rgba(220,38,38,.45);}
.banner::after{content:'';position:absolute;top:-30px;right:-30px;width:110px;height:110px;
  background:rgba(255,255,255,.18);border-radius:50%;}
.banner b{font-size:17px;display:block;margin-bottom:4px;position:relative;}
.banner span{font-size:13px;opacity:.95;position:relative;display:block;}

/* Buttons */
.btn{display:block;width:100%;background:var(--orange);color:#fff;border:none;border-radius:14px;
  padding:15px;font-size:15.5px;font-weight:700;cursor:pointer;text-align:center;}
.btn:active{background:var(--orange-dark);}
.btn.ghost{background:#fff;color:var(--text);border:1.5px solid var(--border);}
.btn.danger{background:#fff;color:#dc2626;border:1.5px solid #fecaca;}
.btn.small{padding:10px;font-size:13.5px;border-radius:10px;}

/* Form */
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border-radius:12px;
  border:1px solid var(--border);font-size:15px;background:#fff;font-family:inherit;}
.upload{border:2px dashed var(--border);border-radius:16px;padding:26px;text-align:center;
  color:var(--muted);font-size:13px;margin-bottom:16px;background:#fff;}

/* Detail overlay */
#detail{position:absolute;inset:0;background:var(--bg);z-index:20;transform:translateX(100%);
  transition:transform .25s ease;display:flex;flex-direction:column;}
#detail.open{transform:translateX(0);}
.detail-hero{height:230px;background:linear-gradient(135deg,#fdba74,#f97316);display:flex;
  align-items:center;justify-content:center;font-size:60px;position:relative;flex-shrink:0;}
.back-btn{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:16px;background:#fff;
  border:none;border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;}
.detail-body{padding:20px;overflow-y:auto;flex:1;}
.detail-body h2{margin:0 0 6px;font-size:20px;}
.detail-body .price{color:var(--orange-dark);font-weight:800;font-size:22px;margin-bottom:14px;}
.detail-body p{color:#555;line-height:1.5;font-size:14.5px;}
.detail-footer{padding:14px 20px;border-top:1px solid var(--border);background:#fff;}

/* Subpage overlay (Profil / Mes annonces / Messagerie / Espace pro) */
#subpage{position:absolute;inset:0;background:var(--bg);z-index:25;transform:translateX(100%);
  transition:transform .25s ease;display:flex;flex-direction:column;}
#subpage.open{transform:translateX(0);}
.subpage-bar{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;
  background:#fff;border-bottom:1px solid var(--border);flex-shrink:0;position:sticky;top:0;z-index:2;}
.subpage-bar button{background:var(--bg);border:none;border-radius:50%;width:34px;height:34px;
  font-size:17px;cursor:pointer;flex-shrink:0;}
.subpage-bar .t{font-weight:700;font-size:16.5px;}
.subpage-body{flex:1;overflow-y:auto;padding:16px 16px 40px;}
.subpage-loading{text-align:center;color:var(--muted);font-size:13px;padding:30px 0;}

/* Ad edit thumb row */
.img-thumb-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.img-thumb{position:relative;width:70px;height:70px;border-radius:12px;overflow:hidden;border:1px solid var(--border);}
.img-thumb img{width:100%;height:100%;object-fit:cover;}
.img-thumb .rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);color:#fff;border:none;
  border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;line-height:1;}

/* Conversation rows */
.conv-row{display:flex;gap:12px;background:#fff;border-radius:16px;border:1px solid var(--border);
  padding:10px;margin-bottom:10px;cursor:pointer;align-items:center;}
.conv-thumb{width:52px;height:52px;border-radius:12px;background:var(--orange);flex-shrink:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;}
.conv-thumb img{width:100%;height:100%;object-fit:cover;}
.conv-info{flex:1;min-width:0;}
.conv-title{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;}
.conv-badge{background:var(--orange);color:#fff;font-size:10.5px;font-weight:800;border-radius:999px;
  padding:2px 7px;flex-shrink:0;}
.conv-date{color:var(--muted);font-size:12px;margin-top:2px;}

/* Chat */
#chatWrap{display:flex;flex-direction:column;height:100%;}
#chatOwner{background:#fff;border-radius:16px;border:1px solid var(--border);padding:14px;margin-bottom:14px;font-size:13px;color:#444;}
#chatOwner .stars{color:#f5a623;font-size:15px;margin:4px 0;}
#chatMessages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 0 12px;}
.msg{max-width:78%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.4;}
.msg.received{align-self:flex-start;background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px;}
.msg.sent{align-self:flex-end;background:var(--orange);color:#fff;border-bottom-right-radius:4px;}
.msg .mt{font-size:10.5px;opacity:.7;margin-top:4px;display:block;}
#chatForm{display:flex;gap:8px;padding-top:10px;flex-shrink:0;}
#chatForm textarea{flex:1;border:1px solid var(--border);border-radius:14px;padding:11px 14px;font-size:14px;
  resize:none;max-height:90px;font-family:inherit;}
#chatForm button{background:var(--orange);color:#fff;border:none;border-radius:50%;width:44px;height:44px;
  font-size:16px;flex-shrink:0;cursor:pointer;}

/* Profile */
.avatar{width:70px;height:70px;border-radius:50%;background:var(--orange);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;margin:10px auto 6px;}
.profile-name{text-align:center;font-weight:700;font-size:17px;}
.profile-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px;}
.menu-row{display:flex;align-items:center;justify-content:space-between;background:#fff;
  padding:15px 16px;border-radius:14px;margin-bottom:10px;border:1px solid var(--border);cursor:pointer;}
.menu-row span.l{display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:600;}

/* Bottom nav */
nav{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);
  display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:10;}
nav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;
  gap:3px;padding:6px 0;color:var(--muted);font-size:10.5px;font-weight:600;cursor:pointer;}
nav button .ic{font-size:20px;}
nav button.active{color:var(--orange-dark);}
#detail .back-btn{z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.detail-scroll{flex:1;overflow-y:auto;}
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:240px;
  background:linear-gradient(135deg,#fdba74,#f97316);}
.gallery>*{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;font-size:60px;}
.gallery img{width:100%;height:100%;object-fit:cover;}
.dt-body{padding:18px 18px 24px;}
.dt-body h2{margin:0 0 6px;font-size:20px;}
.dt-price{color:var(--orange-dark);font-weight:800;font-size:22px;margin-bottom:10px;}
.dt-meta{color:var(--muted);font-size:12.5px;margin-bottom:14px;}
.dt-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.dt-tag{background:#fff7ed;color:var(--orange-dark);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;}
.dt-h{font-size:14px;font-weight:700;margin:18px 0 8px;}
.dt-desc{color:#555;line-height:1.5;font-size:14.5px;white-space:pre-line;}
.dt-attr{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.dt-attr span:first-child{color:var(--muted);}
.dt-seller{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px;font-size:14px;}
.dt-phone{display:block;margin-top:8px;color:var(--orange-dark);font-weight:800;font-size:16px;text-decoration:none;}
.dt-gate{background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:14px;color:#7c2d12;font-size:13.5px;}
.dt-sim{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;}
.dt-sim .s{flex:0 0 130px;background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;}
.dt-sim .s .im{height:80px;background:var(--orange);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;}
.dt-sim .s img{width:100%;height:100%;object-fit:cover;}
.dt-sim .s .tx{padding:7px 8px;font-size:12px;font-weight:600;}
[dir=rtl] .logo,[dir=rtl] .ad-card,[dir=rtl] .ad-info,[dir=rtl] .dt-body,[dir=rtl] .field label{text-align:right}
[dir=rtl] .back-btn,[dir=rtl] .subpage-bar button{transform:scaleX(-1)}
[dir=rtl] .back-btn{left:auto;right:16px}
[dir=rtl] #detail,[dir=rtl] #subpage{transform:translateX(-100%)}
[dir=rtl] #detail.open,[dir=rtl] #subpage.open{transform:translateX(0)}
[dir=rtl] .banner::after{right:auto;left:-30px}
[dir=rtl] .msg.received{border-bottom-left-radius:16px;border-bottom-right-radius:4px}
[dir=rtl] .msg.sent{border-bottom-right-radius:16px;border-bottom-left-radius:4px}
.ad-card{position:relative;}
.new-badge{position:absolute;top:10px;left:10px;background:#16a34a;color:#fff;font-size:9px;
  font-weight:800;letter-spacing:.4px;padding:3px 7px;border-radius:14px 0 8px 0;z-index:2;
  box-shadow:0 1px 3px rgba(0,0,0,.25);}
[dir=rtl] .new-badge{left:auto;right:10px;border-radius:0 14px 0 8px;}
.ad-flags{position:absolute;top:8px;right:10px;display:flex;gap:4px;z-index:2;}
[dir=rtl] .ad-flags{right:auto;left:10px;}
.ad-flag{color:#fff;font-size:9px;font-weight:800;letter-spacing:.4px;padding:3px 7px;border-radius:10px;
  box-shadow:0 1px 3px rgba(0,0,0,.25);}
.ad-flag.boost{background:#f59e0b;}
.ad-flag.urgent{background:#dc2626;}
.ad-thumb.gold{box-shadow:0 0 0 3px #f5b301;}

/* Visionneuse photos (lightbox) */
/* Visionneuse photos (lightbox) */
#lightbox{position:absolute;inset:0;background:#000;z-index:50;display:none;flex-direction:column;}
#lightbox.open{display:flex;}
.lb-count{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:16px;z-index:3;
  color:#fff;font-size:14px;font-weight:700;}
.lb-top-btns{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:3;display:flex;gap:4px;}
.lb-btn{width:40px;height:40px;border:none;border-radius:50%;background:transparent;color:#fff;
  font-size:19px;cursor:pointer;}
.lb-btn:active{background:rgba(255,255,255,.18);}
.lb-nav{position:absolute;top:45%;z-index:3;width:40px;height:40px;border:none;border-radius:50%;
  background:rgba(255,255,255,.16);color:#fff;font-size:18px;cursor:pointer;}
.lb-prev{left:8px;} .lb-next{right:8px;}
.lb-nav.hide{display:none;}
.lb-track{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;}
.lb-track::-webkit-scrollbar{display:none;}
.lb-slide{flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;
  align-items:center;justify-content:center;overflow:hidden;touch-action:pan-x;}
.lb-slide img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center center;
  user-select:none;-webkit-user-drag:none;will-change:transform;}
.lb-caption{flex-shrink:0;color:#fff;font-size:12.5px;text-align:center;padding:8px 16px 6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lb-thumbs{flex-shrink:0;display:flex;gap:6px;overflow-x:auto;justify-content:safe center;
  padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));background:#111;scrollbar-width:none;}
.lb-thumbs::-webkit-scrollbar{display:none;}
.lb-thumb{flex:0 0 auto;width:54px;height:54px;border-radius:4px;overflow:hidden;
  border:2px solid transparent;opacity:.65;cursor:pointer;padding:0;background:#222;}
.lb-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.lb-thumb.on{border-color:#dc2626;opacity:1;}
.gallery>*{cursor:zoom-in;}
</style>
</head>
<body>
<div id="phone">

  <header>
    <div class="logo"><span class="o">Ô</span><span class="z">Z</span><span class="a">A</span><span class="rest">nnonces</span></div>
    <select id="langSelect" onchange="setLang(this.value)" style="float:right;border:1px solid var(--border);border-radius:10px;padding:4px 6px;background:#fff;font-size:13px"><option value="fr">Français</option><option value="en">English</option><option value="ar">العربية</option><option value="es">Español</option></select>
    <div class="greet" id="greetTxt" data-i18n="hdr.hello">Bonjour 👋</div>
    <div class="sub" data-i18n="hdr.sub">Trouvez ce qu'il vous faut, en un instant</div>
  </header>

  <!-- ACCUEIL -->
  <div class="screen active" id="s-accueil">
    <div class="search"><span>🔍</span><input id="homeQ" data-i18n-ph="home.search_ph" placeholder="Que recherchez-vous ?" enterkeyhint="search">
  <button class="btn small" style="width:auto;padding:8px 12px;flex-shrink:0;" onclick="doHomeSearch()" data-i18n="home.search_btn">Rechercher</button></div>
    <div class="cats" id="catsGrid"></div>
    <div id="ozaSection"></div>
    <div class="banner">
      <b data-i18n="home.banner_t">Une seconde vie pour vos objets 🌿</b>
      <span data-i18n="home.banner_s">Déposez votre première annonce en moins d'une minute.</span>
    </div>
    <h3 class="section" data-i18n="home.near">Près de chez vous</h3>
    <div class="ad-list" id="homeList"></div>
  </div>

  <!-- ANNONCES -->
  <div class="screen" id="s-annonces">
  <div class="search" style="margin-bottom:10px;">
    <span>🔍</span><input id="fltQ" data-i18n-ph="list.search_ph" placeholder="Rechercher une annonce…" enterkeyhint="search">
    <button class="btn small" style="width:auto;padding:8px 12px;flex-shrink:0;" onclick="doSearch()" data-i18n="home.search_btn">OK</button>
    <button class="btn small" style="width:auto;padding:8px 12px;flex-shrink:0;" onclick="openFilters()">⚙️ <span data-i18n="list.filters">Filtres</span><span id="fltBadge"></span></button>
  </div>
  <div id="fltSummary" style="font-size:12.5px;color:var(--muted);margin:0 2px 10px;"></div>
  <div class="chips" id="chipsRow"></div>
  <div class="subchips" id="subChipsRow"></div>
  <div class="ad-list" id="fullList"></div>
</div>


  <!-- DÉPOSER -->
  <div class="screen" id="s-deposer">
    <div id="deposer-gate" style="display:none;">
      <h3 class="section" data-i18n="post.title">Déposer une annonce</h3>
      <p style="color:var(--muted);font-size:14px;margin-bottom:18px;" data-i18n="post.need_login">Vous devez être connecté pour déposer une annonce.</p>
      <button class="btn" onclick="go('profil')" data-i18n="auth.login">Se connecter</button>

/* ===== Conformité Google Play : liens externes, signalement, blocage, suppression de compte ===== */

const OZ_TX = {

      del_done:'تم حذف حسابك.',err:'حدث خطأ.',neterr:'خطأ في الشبكة.',privacy:'سياسة الخصوصية',terms:'شروط الاستخدام'}
};
function ozT(k){
  const l = (typeof LANG !== 'undefined' && OZ_TX[LANG]) ? LANG : 'fr';
  return OZ_TX[l][k] || OZ_TX.fr[k] || k;
}
// Ouvre un lien dans le navigateur du téléphone (Capacitor, Cordova ou navigateur classique)
function openExternal(url){
  try{
    const B = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser;
    if(B && B.open){ B.open({ url: url }); return; }
    if(window.cordova){ window.open(url, '_system'); return; }
  }catch(e){}
  window.open(url, '_blank');
}
let reportReturn = null, reportAnnonceId = 0;
function openReport(type, id){
  reportReturn = null; reportAnnonceId = 0;
  if(type === 'user' && typeof currentChat !== 'undefined' && currentChat){
    const c = currentChat, st = (subpageMode === 'msg-chat-standalone');
    reportReturn = () => openChat(c.annonceId, c.otherUserId, st);
    reportAnnonceId = Number(c.annonceId) || 0;
  }
  openSubpage(ozT('report_title'), 'report');
  const reasons = [['spam','r_spam'],['fraud','r_fraud'],['illegal','r_illegal'],['offensive','r_offensive'],['other','r_other']];
  const radios = reasons.map((r, i) =>
    `<label style="display:flex;align-items:center;gap:10px;padding:10px 0;font-size:14.5px;"><input type="radio" name="rpReason" value="${r[0]}" ${i===0?'checked':''} style="width:20px;height:20px;accent-color:var(--orange);">${ozT(r[1])}</label>`).join('');
  document.getElementById('subpageBody').innerHTML = `
    <div style="font-weight:700;margin-bottom:4px;">${ozT('report_reason')}</div>
    ${radios}
    <div class="field" style="margin-top:12px;"><label>${ozT('report_comment')}</label><textarea id="rpComment" rows="3" maxlength="500"></textarea></div>
    <div id="rpMsg" style="font-size:13px;margin-bottom:10px;"></div>
    <button class="btn" id="rpBtn" onclick="submitReport('${type}',${Number(id)})">${ozT('report_send')}</button>`;
}
async function submitReport(type, id){
  const msg = document.getElementById('rpMsg'), btn = document.getElementById('rpBtn');
  const sel = document.querySelector('input[name="rpReason"]:checked');
  btn.disabled = true; msg.style.color = 'var(--muted)'; msg.textContent = '…';
  try{
    const d = await apiFetch('/api_report.php', {method:'POST', body: JSON.stringify({
      type: type, id: id, annonce_id: reportAnnonceId, reason: sel ? sel.value : 'other', comment: document.getElementById('rpComment').value.trim() })});
    if(d.success){
      msg.style.color = '#16a34a'; msg.textContent = ozT('report_thanks');
      setTimeout(() => { if(reportReturn) reportReturn(); else closeSubpage(); }, 1300);
      return;
    }
    msg.style.color = '#dc2626'; msg.textContent = d.error || ozT('err');
  }catch(e){ msg.style.color = '#dc2626'; msg.textContent = ozT('neterr'); }
  btn.disabled = false;
}
async function blockUser(userId){
  if(!confirm(ozT('block_confirm'))) return;
  try{
    const d = await apiFetch('/api_block_user.php', {method:'POST', body: JSON.stringify({ user_id: userId })});
    if(d.success){ alert(ozT('block_done')); if(subpageMode === 'msg-chat') openMessagerie(); else closeSubpage(); }
    else alert(d.error || ozT('err'));
  }catch(e){ alert(ozT('neterr')); }
}
async function deleteAccount(){
  if(!confirm(ozT('del_confirm1'))) return;
  if(!confirm(ozT('del_confirm2'))) return;
  try{
    const d = await apiFetch('/api_delete_account.php', {method:'POST', body: JSON.stringify({ confirm: true })});
    if(d.success){ alert(ozT('del_done')); await logout(); }
    else alert(d.error || ozT('err'));
  }catch(e){ alert(ozT('neterr')); }
}

// Les cookies tiers étant bloqués par les WebView, on renvoie l'ID de session en en-tête
const _origFetch = window.fetch.bind(window);
window.fetch = function(url, opts){
  opts = opts || {};
  if(typeof url === 'string' && url.indexOf(API_BASE) === 0){
    const sid = localStorage.getItem('oz_sid');
    if(sid) opts = Object.assign({}, opts, { headers: Object.assign({}, opts.headers || {}, {'X-Session-Id': sid}) });
  }
  if(typeof url === 'string' && url.indexOf(API_BASE) === 0) url += (url.indexOf('?') > -1 ? '&' : '?') + 'lang=' + LANG;
  return _origFetch(url, opts);
};

// Icône + libellé lisible pour chaque catégorie (clé = slug renvoyé par l'API)
const CAT_META = {
  immobilier:          {icon:'🏠', label:'Immobilier',          color:'#f97316'},
  auto_moto:           {icon:'🚗', label:'Véhicules',           color:'#ef4444'},
  emploi_services:     {icon:'💼', label:'Emploi & Services',   color:'#0ea5e9'},
  ozamarket:           {icon:'🛒', label:'OZAMarket',           color:'#8b5cf6'},
  locations_vacances:  {icon:'🏖️', label:'Locations & Vacances',color:'#14b8a6'},
  baby_sitting:        {icon:'👶', label:'Baby-Sitting',        color:'#ec4899'},
  covoiturage:         {icon:'🚙', label:'Covoiturage',         color:'#3b82f6'},
  dons:                {icon:'🎁', label:'Dons',                color:'#f59e0b'},
  animaux:             {icon:'🐾', label:'Animaux',             color:'#22c55e'},
};
const CAT_ALIAS = {vehicules:'auto_moto',vehicule:'auto_moto',voitures:'auto_moto',voiture:'auto_moto',automoto:'auto_moto',auto:'auto_moto',moto:'auto_moto',
  emploi:'emploi_services',emploiservices:'emploi_services',emploi_et_services:'emploi_services',services:'emploi_services',
  babysitting:'baby_sitting',babysit:'baby_sitting',baby_sit:'baby_sitting',
  locations_et_vacances:'locations_vacances',location_vacances:'locations_vacances',locations:'locations_vacances',vacances:'locations_vacances',
  don:'dons',donation:'dons',animal:'animaux',covoiturages:'covoiturage',immo:'immobilier'};
function normSlug(s){ s = String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,''); return CAT_ALIAS[s] || s; }
function metaFor(slug){ const k = normSlug(slug); const m = CAT_META[k] || {icon:'📦', color:'#94a3b8'};
  return Object.assign({}, m, { label: I18N.fr['cat.'+k] ? t('cat.'+k) : (slug || t('cat.others')) }); }
function catName(slug, name){ const k = normSlug(slug); return I18N.fr['cat.'+k] ? t('cat.'+k) : (name || ''); }
function catLabel(c){ return catName(c.slug, c.name); }

let categories = [];
let catsExpanded = false;
let currentCategoryId = null;


/* ---------- OZAMarket : sous-catégories ---------- */
const SUB_META = {
  meubles:{icon:'🛋️'}, electronique:{icon:'📱'}, bricolage:{icon:'🛠️'}, electromenager:{icon:'🔌'},
  vetements:{icon:'👕'}, jardin:{icon:'🌿'}, sante:{icon:'🩺'}, jeux:{icon:'🧸'}, autres:{icon:'➕'}
};
// Reconnaît la sous-catégorie à partir du slug/nom renvoyé par l'API (fr, en, es, ar)
const SUB_RULES = [
  ['electromenager', /electromenag|appliance|electrodomestic|أجهزة منزلية|اجهزة منزلية/],
  ['electronique',   /electronique|electronic|electronica|multimedia|multimédia|إلكترون|الكترون/],
  ['meubles',        /meuble|furniture|mueble|أثاث|اثاث/],
  ['bricolage',      /bricol|diy|tools|أشغال|اشغال/],
  ['vetements',      /vetement|cloth|ropa|apparel|ملابس/],
  ['jardin',         /jardin|garden|jardín|حديقة|بستن/],
  ['sante',          /sante|health|salud|paramed|صح/],
  ['jeux',           /jeux|jouet|toy|game|juego|juguete|ألعاب|العاب|لعب/],
  ['autres',         /autre|other|otro|أخرى|اخرى/],
];
function subKey(n){
  const raw = ((n && (n.slug||'')) + ' ' + (n && n.name || '')).toLowerCase();
  const flat = raw.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  for(const [k,re] of SUB_RULES){ if(re.test(flat) || re.test(raw)) return k; }
  return null;
}
function subName(n){ const k = subKey(n); return k ? t('sub.'+k) : (n.name || ''); }
function subIcon(n){ const k = subKey(n); return k ? SUB_META[k].icon : '📦'; }
function subNameByText(txt){ if(!txt) return txt; const k = subKey({name:txt}); return k ? t('sub.'+k) : txt; }

function subDefaultName(k){ return t('sub.'+k); }
function ozaTitle(c){ return c ? catLabel(c) : t('cat.ozamarket'); }
function ozaSubtitle(){ return t('oza.sub'); }
function ozaSeeAll(){ return t('oza.see_all'); }
function ozaCat(){ return categories.find(c => normSlug(c.slug) === 'ozamarket') || null; }
let ozaSubs = { lang:null, id:null, nodes:[] };
async function loadOzaSubs(){
  const c = ozaCat(); if(!c) return [];
  if(ozaSubs.id === c.id && ozaSubs.lang === LANG && ozaSubs.nodes.length) return ozaSubs.nodes;
  try{
    const d = await apiFetch('/api_filters.php?category_id=' + c.id);
    ozaSubs = { lang: LANG, id: c.id, nodes: (d && d.success && d.tree) ? d.tree : [] };
  }catch(e){ ozaSubs = { lang: LANG, id: c.id, nodes: [] }; }
  return ozaSubs.nodes;
}

// Bloc OZAMarket de l'accueil : affiché dès le départ avec les sous-catégories par défaut,
// puis remplacé par les vraies sous-catégories (avec leurs identifiants) quand l'API répond.
const SUB_DEFAULTS = ['meubles','electronique','bricolage','electromenager','vetements','jardin','sante','jeux','autres'];
function ozaTiles(){
  const nodes = ozaSubs.nodes;
  return nodes.length
    ? nodes.map(n => ({ id:n.id, key:subKey(n), icon:subIcon(n), name:subName(n) }))
    : SUB_DEFAULTS.map(k => ({ id:null, key:k, icon:SUB_META[k].icon, name:subDefaultName(k) }));
}
function renderOza(){
  const el = document.getElementById('ozaSection'); if(!el) return;
  const c = ozaCat();
  el.innerHTML = `<div class="oza-box">
    <div class="oza-head" onclick="pickOzaSub(null)">
      <div><div class="tt">🛒 ${escapeHtml(ozaTitle(c))}</div><div class="ss">${ozaSubtitle()}</div></div>
      <span class="all">${ozaSeeAll()} ›</span>
    </div>
    <div class="oza-scroll">${ozaTiles().map(x =>
      `<div class="oza-tile" onclick="pickOzaSub(${x.id},'${x.key || ''}')"><div class="ico">${x.icon}</div><div class="lab">${escapeHtml(x.name)}</div></div>`
    ).join('')}</div>
  </div>`;
  // Récupère les vraies sous-catégories en arrière-plan, puis réaffiche
  if(c && (ozaSubs.id !== c.id || ozaSubs.lang !== LANG || !ozaSubs.nodes.length)){
    loadOzaSubs().then(n => { if(n.length) renderOza(); });
  }
}

// Puces de sous-catégories affichées dans l'écran Annonces quand OZAMarket est sélectionné
async function renderSubChips(){
  const el = document.getElementById('subChipsRow'); if(!el) return;
  const c = ozaCat();
  if(!c || currentCategoryId !== c.id){ el.innerHTML = ''; return; }
  const nodes = await loadOzaSubs();
  if(currentCategoryId !== c.id){ el.innerHTML = ''; return; }
  el.innerHTML = `<div class="subchip ${!searchFilters.subId?'on':''}" onclick="pickOzaSub(null)">${t('oza.all')}</div>` +
    nodes.map(n => `<div class="subchip ${searchFilters.subId===n.id?'on':''}" onclick="pickOzaSub(${n.id})">${subIcon(n)} ${escapeHtml(subName(n))}</div>`).join('');
}

async function pickOzaSub(subId, key){
  const c = ozaCat(); if(!c) return;
  const nodes = await loadOzaSubs();
  let n = null;
  if(subId) n = nodes.find(x => x.id === subId) || null;
  else if(key) n = nodes.find(x => subKey(x) === key) || null; // tuile par défaut : retrouve l'identifiant réel
  currentCategoryId = c.id;
  searchFilters.subId = n ? n.id : null;
  searchFilters.subLabel = n ? subName(n) : '';
  searchFilters.type = '';
  runSearch(); go('annonces'); renderChips();
}

async function loadCategories(){
  try{
    const res = await fetch(API_BASE + '/api_categories.php');
    const data = await res.json();
    if(data.success) categories = data.categories;
  }catch(e){ console.warn('Catégories indisponibles, hors-ligne ?', e); }
  renderCats();
  renderChips();
  fillDeposerCategories();
}

function renderCats(){
  const el = document.getElementById('catsGrid');
  if(!categories.length){ el.innerHTML = `<p style="color:#999;font-size:13px;grid-column:1/-1">${t('cat.loading')}</p>`; return; }
  let list = categories.filter(c => normSlug(c.slug) !== 'ozamarket');
  renderOza();
  let items;
  if(!catsExpanded){
    items = list.slice(0,3).map(c=>{
      const m = metaFor(c.slug);
      return `<div class="cat" onclick="filterByCategory(${c.id})"><div class="ico">${m.icon}</div><div class="lab">${m.label}</div></div>`;
    });
    items.push(`<div class="cat" onclick="catsExpanded=true;renderCats();"><div class="ico">⋯</div><div class="lab">${t('cat.others')}</div></div>`);
  } else {
    items = list.map(c=>{
      const m = metaFor(c.slug);
      return `<div class="cat" onclick="filterByCategory(${c.id})"><div class="ico">${m.icon}</div><div class="lab">${m.label}</div></div>`;
    });
  }
  el.innerHTML = items.join('');
}

function renderChips(){
  const el = document.getElementById('chipsRow');
  const chips = [`<div class="chip ${currentCategoryId===null?'on':''}" onclick="filterByCategory(null)">${t('cat.all')}</div>`]
    .concat(categories.map(c=>{
      const m = metaFor(c.slug);
      return `<div class="chip ${currentCategoryId===c.id?'on':''}" onclick="filterByCategory(${c.id})">${m.icon} ${m.label}</div>`;
    }));
  el.innerHTML = chips.join('');
  renderSubChips();
}

function filterByCategory(categoryId){
  currentCategoryId = categoryId;
  searchFilters.subId = null; searchFilters.subLabel = ''; searchFilters.type = '';
  runSearch();
  go('annonces');
  renderChips();
}

let lastAds = []; // annonces actuellement affichées (pour ouvrir le détail par index)

// État de pagination par liste ('homeList' ou 'fullList') : catégorie en cours,
// page déjà chargée, nombre total d'annonces côté serveur, et les annonces
// cumulées jusqu'ici (nécessaire pour que "Voir plus" ajoute à la suite au
// lieu de tout recharger depuis le début).
const listState = {};

async function loadListings(categoryId, targetId){
  const el = document.getElementById(targetId);
  el.innerHTML = '<p style="color:#999;font-size:13px;text-align:center;padding:20px">'+t('list.loading')+'</p>';
  listState[targetId] = { categoryId, page: 1, total: 0, items: [] };
  try{
    const url = buildUrl(targetId, 1, categoryId);
    const res = await fetch(url);
    const data = await res.json();
    if(!data.success) throw new Error('Réponse invalide');
    const st = listState[targetId];
    st.items = data.listings;
    st.total = data.total || data.listings.length;
    lastAds = st.items;
    if(lastAds[0]) console.debug('Exemple image annonce :', lastAds[0].image);
    renderList(targetId, st.items, st.total);
  }catch(e){
    console.warn('Annonces indisponibles', e);
    el.innerHTML = '<p style="color:#999;font-size:13px;text-align:center;padding:20px">'+t('list.error')+'</p>';
  }
}

async function loadMoreListings(targetId){
  const st = listState[targetId];
  if(!st) return;
  const btn = document.getElementById('more-' + targetId);
  if(btn){ btn.disabled = true; btn.textContent = t('list.loading_short'); }
  try{
    const url = buildUrl(targetId, st.page + 1, st.categoryId);
    const res = await fetch(url);
    const data = await res.json();
    if(!data.success) throw new Error('Réponse invalide');
    st.page += 1;
    st.items = st.items.concat(data.listings);
    st.total = data.total || st.total;
    lastAds = st.items;
    renderList(targetId, st.items, st.total);
  }catch(e){
    console.warn('Chargement de la suite impossible', e);
    if(btn){ btn.disabled = false; btn.textContent = t('list.retry'); }
  }
}
const NEW_DAYS = 3; // une annonce est "nouvelle" pendant 3 jours
function isNew(a){
  const raw = a.created_at;
  if(!raw) return false;
  const d = new Date(String(raw).replace(' ', 'T'));
  return !isNaN(d) && (Date.now() - d.getTime()) < NEW_DAYS * 86400000;
}
function newBadge(a){
  if(!isNew(a)) return '';
  const lab = {fr:'NOUVEAU', en:'NEW', ar:'جديد', es:'NUEVO'}[LANG] || 'NEW';
  return `<span class="new-badge">${lab}</span>`;
}

const FLAG_LABELS = {
  boost:  {fr:'À LA UNE', en:'FEATURED', ar:'مميز',  es:'DESTACADO'},
  urgent: {fr:'URGENT',   en:'URGENT',   ar:'عاجل',  es:'URGENTE'}
};
function flagsHtml(a){
  const l = k => (FLAG_LABELS[k][LANG] || FLAG_LABELS[k].fr);
  const out = (a.boosted ? `<span class="ad-flag boost">⭐ ${l('boost')}</span>` : '')
            + (a.urgent  ? `<span class="ad-flag urgent">⚡ ${l('urgent')}</span>` : '');
  return out ? `<div class="ad-flags">${out}</div>` : '';
}

function renderList(targetId, list, total){

  if(!list.length){
    el.innerHTML = '<p style="color:#999;font-size:13px;text-align:center;padding:20px">'+t('list.none')+'</p>';

/* ---------- VISIONNEUSE PHOTOS (zoom + défilement + miniatures) ---------- */
const lb = { idx:0, s:1, x:0, y:0, pinch:null, pan:null, lastTap:0, timer:null };

function lbImg(){ const sl = document.getElementById('lbTrack').children[lb.idx]; return sl ? sl.firstElementChild : null; }
function lbApply(){
  const im = lbImg(), tr = document.getElementById('lbTrack');
  if(im) im.style.transform = `translate(${lb.x}px,${lb.y}px) scale(${lb.s})`;
  tr.style.overflowX = lb.s > 1 ? 'hidden' : 'auto';
}
function lbReset(){
  const im = lbImg(); if(im) im.style.transform = '';
  lb.s = 1; lb.x = 0; lb.y = 0; lb.pinch = null; lb.pan = null;
  document.getElementById('lbTrack').style.overflowX = 'auto';
}
function lbClamp(){
  const tr = document.getElementById('lbTrack');
  const mx = (lb.s - 1) * tr.clientWidth / 2, my = (lb.s - 1) * tr.clientHeight / 2;
  lb.x = Math.max(-mx, Math.min(mx, lb.x));
  lb.y = Math.max(-my, Math.min(my, lb.y));
}
function lbUpdateUI(){
  const n = document.getElementById('lbTrack').children.length;
  document.getElementById('lbCount').textContent = (lb.idx + 1) + ' / ' + n;
  document.getElementById('lbCaption').textContent = (currentDetail && currentDetail.annonce.title) || '';
  document.getElementById('lbPrev').classList.toggle('hide', n < 2);
  document.getElementById('lbNext').classList.toggle('hide', n < 2);
  document.getElementById('lbThumbs').style.display = n < 2 ? 'none' : 'flex';
  document.querySelectorAll('#lbThumbs .lb-thumb').forEach((b, i) => {
    b.classList.toggle('on', i === lb.idx);
    if(i === lb.idx) b.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
  });
}
function lbShow(i, smooth){
  const tr = document.getElementById('lbTrack');
  const n = tr.children.length;
  i = Math.max(0, Math.min(n - 1, i));
  lbReset();
  lb.idx = i;
  tr.scrollTo({left: i * tr.clientWidth, behavior: smooth ? 'smooth' : 'auto'});
  lbUpdateUI();
}
function lbGo(d){ lbShow(lb.idx + d, true); }
function lbToggleZoom(){
  if(lb.s > 1) lbReset(); else { lb.s = 2.5; lb.x = 0; lb.y = 0; lbApply(); }
}

function openLightbox(i){
  const imgs = (currentDetail && currentDetail.annonce.images || []).filter(x => x.url);
  if(!imgs.length) return;
  document.getElementById('lbTrack').innerHTML = imgs.map(x =>
    `<div class="lb-slide"><img src="${escapeHtml(x.url)}" alt="" draggable="false"></div>`).join('');
  document.getElementById('lbThumbs').innerHTML = imgs.map((x, k) =>
    `<button class="lb-thumb" onclick="lbShow(${k}, true)"><img src="${escapeHtml(x.url)}" alt=""></button>`).join('');
  document.getElementById('lightbox').classList.add('open');
  lbShow(i || 0, false);
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lbTrack').innerHTML = '';
  document.getElementById('lbThumbs').innerHTML = '';
  lbReset();
}

(function initLightbox(){
  const tr = document.getElementById('lbTrack');
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);

  // Swipe entre photos : met à jour compteur / miniatures, remet le zoom à zéro
  tr.addEventListener('scroll', () => {
    clearTimeout(lb.timer);
    lb.timer = setTimeout(() => {
      const i = Math.round(tr.scrollLeft / tr.clientWidth);
      if(i !== lb.idx && i >= 0 && i < tr.children.length){ lbReset(); lb.idx = i; lbUpdateUI(); }
    }, 80);
  });

  tr.addEventListener('touchstart', e => {
    if(e.touches.length === 2){
      lb.pinch = { d: dist(e.touches), s: lb.s };
    } else if(e.touches.length === 1){
      const now = Date.now();
      if(now - lb.lastTap < 300){ lbToggleZoom(); lb.lastTap = 0; return; }
      lb.lastTap = now;
      lb.pan = { x: e.touches[0].clientX, y: e.touches[0].clientY, tx: lb.x, ty: lb.y };
    }
  }, {passive:true});

  tr.addEventListener('touchmove', e => {
    if(lb.pinch && e.touches.length === 2){
      e.preventDefault();
      lb.s = Math.max(1, Math.min(5, lb.pinch.s * dist(e.touches) / lb.pinch.d));
      if(lb.s === 1){ lb.x = 0; lb.y = 0; }
      lbClamp(); lbApply();
    } else if(lb.s > 1 && lb.pan && e.touches.length === 1){
      e.preventDefault();
      lb.x = lb.pan.tx + (e.touches[0].clientX - lb.pan.x);
      lb.y = lb.pan.ty + (e.touches[0].clientY - lb.pan.y);
      lbClamp(); lbApply();
    }
  }, {passive:false});

  tr.addEventListener('touchend', e => {
    if(e.touches.length < 2) lb.pinch = null;
    if(lb.s < 1.05) lbReset();
    else if(e.touches.length === 1)
      lb.pan = { x: e.touches[0].clientX, y: e.touches[0].clientY, tx: lb.x, ty: lb.y };
    else lb.pan = null;
  }, {passive:true});

  tr.addEventListener('dblclick', lbToggleZoom);
  document.addEventListener('keydown', e => {
    if(!document.getElementById('lightbox').classList.contains('open')) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowRight') lbGo(1);
    if(e.key === 'ArrowLeft')  lbGo(-1);
  });
})();

function updateBoostTotal(){
  const auto = document.getElementById('bAuto').checked;
  document.getElementById('bDurWrap').style.display = auto ? 'block' : 'none';
  let total = 0;
  if(auto) total += BOOST_DUR[document.getElementById('bDur').value] || 0;
  if(document.getElementById('bUrgent').checked) total += BOOST_URGENT;
  if(document.getElementById('bPhoto').checked)  total += BOOST_PHOTO;
  document.getElementById('bTotal').textContent = total + ' ' + BOOST_CUR;
}
async function payBoost(id){
  const T = bt();
  const msg = document.getElementById('bMsg'), btn = document.getElementById('bPay');
  msg.textContent = '';
  const auto = document.getElementById('bAuto').checked;
  const urgent = document.getElementById('bUrgent').checked;
  const photo = document.getElementById('bPhoto').checked;
  if(!auto && !urgent && !photo){ msg.textContent = T.choose; return; }
  btn.disabled = true;
  try{
    // Le serveur renvoie une URL à usage unique qui ouvre la session dans le navigateur
    const data = await apiFetch('/api_pay_token.php', {method:'POST', body: JSON.stringify({
      annonce_id: id, auto_boost: auto, boost_duration: document.getElementById('bDur').value,
      urgent_badge: urgent, photo_highlight: photo
    })});
    if(data.success && data.url){ boostPending = true; openExternal(data.url); }
    else { msg.textContent = data.error || T.err; }
  }catch(e){ msg.textContent = T.neterr + ' (' + (e && e.message ? e.message : e) + ')'; }
  btn.disabled = false;
}

async function openChat(annonceId, otherUserId, standalone){

  currentChat = { annonceId, otherUserId, conversationId:null };
  try{
    const url = '/api_conversation_messages.php?annonce_id=' + annonceId + (otherUserId ? '&to=' + otherUserId : '');

    if(!data.success){ document.getElementById('subpageBody').innerHTML = '<p class="subpage-loading">'+(data.error||t('common.err'))+'</p>'; return; }
    document.getElementById('subpageTitle').textContent = data.annonce_title || t('msg.chat');
    currentChat.conversationId = data.conversation_id;
    currentChat.otherUserId = data.other_user_id;

    let ownerHtml = '';
    if(data.other_user){
      const ou = data.other_user;
      let stars = '';
      const rounded = ou.moyenne_note ? Math.round(ou.moyenne_note) : 0;
      for(let i=1;i<=5;i++) stars += `<span onclick="rateOwner(${ou.id},${i})" style="cursor:pointer">${i<=rounded?'★':'☆'}</span>`;
      ownerHtml = `<div id="chatOwner">
        <b>${escapeHtml(ou.nom)} ${escapeHtml(ou.prenom)}</b><br>
        📍 ${escapeHtml(ou.city||t('msg.city_unset'))} · ${t('msg.since',{d:ou.membre_depuis})}<br>
        ${t('msg.active_ads',{n:ou.total_annonces})}
        <div class="stars" id="starsRow">${stars}</div>
        <span style="font-size:12px;color:var(--muted);">${ou.moyenne_note ? t('msg.rating',{avg:ou.moyenne_note,n:ou.nb_notes}) : t('msg.not_rated')}</span>
      </div>`;
    }
    const msgsHtml = data.messages.map(m => `
      <div class="msg ${m.type}">${escapeHtml(m.text)}<span class="mt">${new Date(m.time).toLocaleString(LANG_LOCALE[LANG],{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span></div>
    `).join('') || '<p class="subpage-loading">'+t('msg.empty')+'</p>';

    const chatActions = data.other_user_id ? `<div style="display:flex;gap:8px;padding:6px 0 10px;"><button class="btn ghost small" onclick="openReport('user',${Number(data.other_user_id)})">${ozT('report_user')}</button><button class="btn ghost small" onclick="blockUser(${Number(data.other_user_id)})">${ozT('block_user')}</button></div>` : '';
    document.getElementById('subpageBody').innerHTML = `

        ${ownerHtml}${chatActions}

          <button onclick="submitChatMessage()" ${!data.other_user_id ? 'disabled' : ''}>➤</button>
        </form>
      </div>
    `;

  }catch(e){
    document.getElementById('subpageBody').innerHTML = '<p class="subpage-loading">'+t('net.error')+'</p>';
  }
}
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
async function submitChatMessage(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text || !currentChat.otherUserId) return;
  try{
    const data = await apiFetch('/api_send_message.php', {method:'POST', body: JSON.stringify({
      annonce_id: currentChat.annonceId,
      recipient_id: currentChat.otherUserId,
      conversation_id: currentChat.conversationId || 0,
      message: text,
    })});
    if(data.success){
      input.value = '';
      currentChat.conversationId = data.conversation_id;
      openChat(currentChat.annonceId, currentChat.otherUserId);
    } else {
      alert(data.error || t('msg.send_err'));
    }
  }catch(e){ alert(t('net.error')); }
}

}

const depSubCache = {};
// Crée le champ « Sous-catégorie » s'il n'existe pas dans le formulaire (ne dépend pas du HTML du formulaire)
function ensureSubField(){
  let f = document.getElementById('dSubField');
  if(f) return f;
  const cat = document.getElementById('dCat'); if(!cat) return null;
  const wrap = cat.closest('.field') || cat.parentNode;
  f = document.createElement('div');
  f.className = 'field'; f.id = 'dSubField'; f.style.display = 'none';
  f.innerHTML = '<label id="dSubLabel"></label><select id="dSub" autocomplete="off"></select>';
  wrap.insertAdjacentElement('afterend', f);
  return f;
}
// Écoute globale : fonctionne même si le formulaire est reconstruit ou si la valeur est restaurée par le navigateur
document.addEventListener('change', e => { if(e.target && e.target.id === 'dCat') onDepCatChange(); });

async function onDepCatChange(){
  const catSel = document.getElementById('dCat'), field = ensureSubField(), sub = document.getElementById('dSub');

  const cid = catSel.value;
  sub.innerHTML = ''; field.style.display = 'none';
  if(!cid) return;
  const key = cid + '|' + LANG;
  if(!depSubCache[key]){
    try{
      const d = await apiFetch('/api_filters.php?category_id=' + cid);
      depSubCache[key] = (d && d.success && d.tree) ? d.tree : [];
    }catch(e){ depSubCache[key] = []; }
  }
  if(catSel.value !== cid) return; // la catégorie a changé entre-temps
  let tree = depSubCache[key];
  const c = categories.find(x => String(x.id) === cid);
  const isOza = !!(c && normSlug(c.slug) === 'ozamarket');
  // Sans réponse de api_filters.php : OZAMarket propose quand même ses sous-catégories (le serveur retrouve l'identifiant)
  if(!tree.length && isOza) tree = SUB_DEFAULTS.map(k => ({ id:'k:' + k, name:subDefaultName(k), children:[], _icon:SUB_META[k].icon }));
  if(!tree.length) return;
  const opt = n => `<option value="${n.id}">${escapeHtml((n._icon || subIcon(n)) + ' ' + subName(n))}</option>`;
  sub.innerHTML = '<option value="">' + t('post.choose') + '</option>' + tree.map(n =>
    (n.children && n.children.length)
      ? `<optgroup label="${escapeHtml(subName(n))}">${n.children.map(opt).join('')}</optgroup>`
      : opt(n)
  ).join('');
  document.getElementById('dSubLabel').textContent = t('post.f_sub') + (isOza ? ' *' : '');
  field.dataset.required = isOza ? '1' : '';
  field.style.display = '';
}

async function onPhotosPicked(e){
  const files = Array.from(e.target.files || []);

  for(const file of files){
    if(dPhotos.length >= D_MAX_PHOTOS){ msg.textContent = `Maximum ${D_MAX_PHOTOS} photos.`; break; }
    if(!file.type.startsWith('image/')) continue;
    try{
      const blob = await downscaleImage(file, 1600, 0.82);
      dPhotos.push({ blob, url: URL.createObjectURL(blob) });
    }catch(err){ msg.textContent = 'Photo illisible : ' + file.name; }
  }
   renderDPhotos();
  scheduleAutoDescription();   // ← nouvelle ligne
}

// Réduit la photo (max 1600 px, JPEG) : envoi plus rapide, moins de risque de dépasser les limites du serveur
function downscaleImage(file, maxSide, quality){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('toBlob')), 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load')); };
    img.src = url;
  });
}

function renderDPhotos(){
  const el = document.getElementById('dThumbs');
  if(!el) return;
  el.innerHTML = dPhotos.map((p,i) =>
    `<div class="img-thumb"><img src="${p.url}"><button class="rm" onclick="removeDPhoto(${i})">✕</button></div>`).join('');
}
function removeDPhoto(i){
  const p = dPhotos.splice(i,1)[0];
  if(p) URL.revokeObjectURL(p.url);
  renderDPhotos();
}

const blobToB64 = b => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result.split(',')[1]); r.onerror = rej;
  r.readAsDataURL(b);
});

let autoTimer = null;
function scheduleAutoDescription(){
  clearTimeout(autoTimer);
  autoTimer = setTimeout(() => generateDescription(true), 1200); // anti-rebond
}

async function generateDescription(auto){
  auto = (auto === true); // true = déclenchement automatique, sinon clic sur le bouton
  const ta = document.getElementById('dDesc'), btn = document.getElementById('dAiBtn');
  if(!ta) return;
  if(aiState.busy){ if(auto) scheduleAutoDescription(); return; }

  const v = id => document.getElementById(id).value.trim();
  const title = v('dTitle');
  if(title.length < 3){ if(!auto) showAiHint(aiT().need, 'info'); return; }

  // Ne jamais écraser un texte saisi par l'annonceur
  const cur = ta.value.trim();
  const userText = cur !== '' && cur !== aiState.text;
  if(auto && userText) return;
  if(!auto && userText && !confirm(aiT().replace)) return;

  // Évite les appels inutiles (limite de 10 par heure)
  const sel = document.getElementById('dCat');
  const subSel = document.getElementById('dSub');
  const subTxt = (subSel && subSel.value) ? subSel.options[subSel.selectedIndex].text.replace(/^\S+\s/, '') : '';
  const sig = title + '|' + sel.value + '|' + (subSel ? subSel.value : '') + '|' + dPhotos.slice(0,3).map(p => p.blob.size).join(',');
  if(auto && sig === aiState.sig) return;
  aiState.sig = sig;

  aiState.busy = true; btn.disabled = true; btn.textContent = aiT().busy;
  showAiHint(aiT().busy, 'info');
  try{
    const photos = [];
    for(const p of dPhotos.slice(0, 3)) photos.push(await blobToB64(await downscaleImage(p.blob, 768, 0.7)));
    const payload = {
      title: title,
      category: sel.value ? sel.options[sel.selectedIndex].text : '',
      subcategory: subTxt,
      city: v('dCity'),
      price: v('dPrice'),
      lang: LANG,
      photos: photos,
      currency: 'DH'
    };
    const data = await apiFetch('/api_ad_describe.php', {method:'POST', body: JSON.stringify(payload)});
    if(data.success){
      ta.value = data.description; aiState.text = data.description;
      if(data.debug) console.warn('Diagnostic IA :', data.debug);
      showAiHint((data.source === 'ai' ? aiT().ai : aiT().tpl)
        + (data.todo ? '<br><b>' + aiT().todo + '</b>' + escapeHtml(data.todo) : '')
        + (data.debug ? '<br><small>' + escapeHtml(data.debug) + '</small>' : ''), 'ok'); // debug : à retirer en production
      btn.textContent = aiT().again;
    } else {
      showAiHint(escapeHtml(data.error || t('common.err')), 'info');
      btn.textContent = aiT().btn;
    }
  }catch(e){
    console.warn('describe error', e);
    showAiHint(t('net.error') + ' <small>(' + escapeHtml(e.message || String(e)) + ')</small>', 'info');
    btn.textContent = aiT().btn;
  }
  btn.disabled = false; aiState.busy = false;
}

let cityTimer = null;
function bindCityAutocomplete(inputId, listId){
  const inp = document.getElementById(inputId);
  if(!inp) return;
  const old = document.getElementById(listId); if(old) old.remove(); // le datalist n'est plus utilisé
  inp.removeAttribute('list');

  const box = document.createElement('div');
  box.style.cssText = 'display:none;background:#fff;border:1px solid var(--border);border-radius:12px;' +
    'margin-top:4px;max-height:220px;overflow-y:auto;box-shadow:0 6px 16px rgba(0,0,0,.08);';
  inp.insertAdjacentElement('afterend', box);

  inp.addEventListener('input', () => {
    clearTimeout(cityTimer);
    const v = inp.value.trim();
    if(v.length < 2){ box.style.display = 'none'; return; }
    cityTimer = setTimeout(async () => {
      try{
        let names;
        if(API_BASE.endsWith('.ma')){
          const r = await fetch(API_BASE + '/get_cities.php?q=' + encodeURIComponent(v) + '&limit=10');
          const d = await r.json();
          names = (Array.isArray(d) ? d : []).map(c => typeof c === 'string' ? c : (c.nom || c.name || ''));
        } else {
          const r = await fetch('https://geo.api.gouv.fr/communes?nom=' + encodeURIComponent(v) + '&fields=nom&boost=population&limit=10');
          names = (await r.json()).map(c => c.nom);
        }
        names = names.filter(Boolean);
        box.innerHTML = names.map(n =>
          `<div class="cs" style="padding:12px 14px;font-size:14.5px;border-bottom:1px solid var(--border);cursor:pointer;">${escapeHtml(n)}</div>`).join('');
        box.style.display = names.length ? 'block' : 'none';
      }catch(e){ box.style.display = 'none'; }
    }, 250);
  });

  box.addEventListener('pointerdown', e => {
    const it = e.target.closest('.cs'); if(!it) return;
    e.preventDefault();
    inp.value = it.textContent;
    box.style.display = 'none';
  });
  inp.addEventListener('blur', () => setTimeout(() => box.style.display = 'none', 150));
}

const searchFilters = { q:'', city:'', priceMin:'', priceMax:'', type:'', subId:null, subLabel:'' };

/* Retrouve un nœud de sous-catégorie (arbre OZAMarket de l'accueil ou arbre de la sous-page Filtres) */
function findSubNode(id, nodes){
  for(const n of (nodes || [])){
    if(n.id === id) return n;
    const r = findSubNode(id, n.children);
    if(r) return r;
  }
  return null;
}
function collectSubIds(n){ return [n.id].concat(...(n.children || []).map(collectSubIds)); }
// id de la sous-catégorie + ids de tous ses descendants
function subIdsFor(id){
  const n = findSubNode(id, ozaSubs.nodes) || findSubNode(id, fltTree);
  return n ? collectSubIds(n) : [id];
}

function buildUrl(targetId, page, categoryId){
  if(targetId === 'homeList'){
    let u = API_BASE + '/api_listings.php?page=' + page;
    if(categoryId) u += '&category_id=' + categoryId;
    return u;
  }
  const f = searchFilters, p = new URLSearchParams({ page });
  if(f.subId){
    // Une sous-catégorie identifie déjà sa catégorie : on n'envoie PAS category_id
    // (sinon le serveur croise les deux critères et renvoie 0 résultat pour OZAMarket).
    // On envoie aussi tous les descendants, pour qu'un parent (« Tout X ») ramène les annonces de ses enfants.
    const ids = subIdsFor(f.subId);
    p.set('subcategory_id', f.subId);
    if(ids.length > 1) p.set('subcategory_ids', ids.join(','));
  } else if(categoryId){
    p.set('category_id', categoryId);
  }
  if(f.q)         p.set('q', f.q);
  if(f.city)      p.set('city', f.city);
  if(f.priceMin !== '') p.set('price_min', f.priceMin);
  if(f.priceMax !== '') p.set('price_max', f.priceMax);
  if(f.type && categoryId === 4) p.set('type', f.type);
  return API_BASE + '/api_listings.php?' + p.toString();  // (ex-api_search.php, désormais géré par api_listings.php)
}

function runSearch(){
  renderFilterSummary();
  loadListings(currentCategoryId, 'fullList');
}

function renderFilterSummary(){
  const f = searchFilters, parts = [];
  if(f.q) parts.push('« ' + f.q + ' »');
  if(f.subLabel) parts.push(f.subLabel);
  if(f.city) parts.push('📍 ' + f.city);
  if(f.priceMin !== '' || f.priceMax !== '') parts.push((f.priceMin || 0) + ' – ' + (f.priceMax || '∞'));
  if(f.type) parts.push(f.type === 'offer' ? t('filters.sell') : t('filters.seek'));
  const n = (f.subId?1:0) + (f.city?1:0) + ((f.priceMin!==''||f.priceMax!=='')?1:0) + (f.type?1:0);
  document.getElementById('fltBadge').textContent = n ? ' (' + n + ')' : '';
  document.getElementById('fltSummary').innerHTML = parts.length
    ? escapeHtml(parts.join(' · ')) + ' — <a href="#" style="color:var(--orange-dark);font-weight:600;" onclick="resetSearchFilters(true);return false;">'+t('list.clear')+'</a>'
    : '';
}

function resetSearchFilters(runNow){

}

/* Sous-page "Filtres" */
let fltTree = [], fltIndex = {}, fltStack = [], fltPending = { id:null, label:'' };

async function openFilters(){
  openSubpage(t('filters.title'), 'filters');

  fltPending = { id: f.subId, label: f.subLabel };

    categories.map(c => `<option value="${c.id}" ${c.id===fltCat?'selected':''}>${escapeHtml(metaFor(c.slug).icon + ' ' + catLabel(c))}</option>`).join('');
  document.getElementById('subpageBody').innerHTML = `
    <div class="field"><label data-i18n="filters.cat">Catégorie</label>
      <select id="fltCat" onchange="onFltCatChange(this.value)">${catOpts}</select></div>
    <div id="fltSubWrap"></div>
    <datalist id="fCityList"></datalist>
    <div class="field" style="margin-top:14px;"><label data-i18n="filters.city">Ville</label>
      <input id="fltCity" list="fCityList" autocomplete="off" data-i18n-ph="filters.all_cities" placeholder="Toutes les villes" value="${escapeHtml(f.city)}"></div>
    <div class="field"><label data-i18n="filters.pmin">Prix minimum</label>
      <input id="fltPmin" type="number" inputmode="decimal" min="0" value="${escapeHtml(f.priceMin)}"></div>
    <div class="field"><label data-i18n="filters.pmax">Prix maximum</label>
      <input id="fltPmax" type="number" inputmode="decimal" min="0" value="${escapeHtml(f.priceMax)}"></div>

    <button class="btn" onclick="applySearchFilters()">${t('filters.show')}</button>
    <button class="btn ghost" style="margin-top:10px;" onclick="resetSearchFilters(true);closeSubpage();">${t('filters.reset')}</button>
  `;
  bindAdCityAutocomplete('fltCity', 'fCityList');
  renderFltType();
  await loadFltTree();

let fltCat = null;

function renderFltType(){
  const w = document.getElementById('fltTypeWrap'); if(!w) return;
  w.innerHTML = fltCat === 4 ? `<div class="field"><label data-i18n="filters.type">Type d'annonce</label>
    <select id="fltType">
      <option value="">Toutes</option>
      <option value="offer" ${searchFilters.type==='offer'?'selected':''}>${t('filters.sell')}</option>
      <option value="demand" ${searchFilters.type==='demand'?'selected':''}>${t('filters.seek')}</option>
    </select></div>` : '';
}

async function loadFltTree(){
  const w = document.getElementById('fltSubWrap'); if(!w) return;
  fltStack = []; fltTree = []; fltIndex = {};
  if(!fltCat){ w.innerHTML = ''; return; }
  w.innerHTML = '<h3 class="section" data-i18n="filters.sub">Sous-catégorie</h3><div id="fltSub"><p class="subpage-loading">Chargement…</p></div>';
  try{
    const d = await apiFetch('/api_filters.php?category_id=' + fltCat);
    fltTree = d.success ? d.tree : [];
    (function idx(nodes){ nodes.forEach(n => { fltIndex[n.id] = n; idx(n.children); }); })(fltTree);
  }catch(e){ fltTree = []; }
  renderFltSub();
}

function onFltCatChange(v){
  fltCat = v ? parseInt(v, 10) : null;
  fltPending = { id:null, label:'' };
  renderFltType();
  loadFltTree();
}

function renderFltSub(){
  const el = document.getElementById('fltSub'); if(!el) return;
  const cur = fltStack.length ? fltStack[fltStack.length - 1] : null;
  const nodes = cur ? cur.children : fltTree;
  const row = (label, click, sel, arrow) =>
    `<div class="menu-row" style="${sel?'border-color:var(--orange);':''}" onclick="${click}">
       <span class="l">${sel?'✅ ':''}${escapeHtml(label)}</span><span>${arrow?'›':''}</span></div>`;
  let h = '';
  if(cur){
    h += `<div class="chip" style="display:inline-block;margin-bottom:10px;" onclick="fltUp()">← ${escapeHtml(cur.name)}</div>`;
    h += row('Tout « ' + cur.name + ' »', `fltPick(${cur.id})`, fltPending.id === cur.id, false);
  } else {
    h += row(t('filters.all_subs'), 'fltPick(0)', !fltPending.id, false);
  }
  if(!nodes.length && !cur) h += '<p class="subpage-loading">Aucune sous-catégorie.</p>';
  nodes.forEach(n => {
    h += row(subName(n), n.children.length ? `fltOpen(${n.id})` : `fltPick(${n.id})`, fltPending.id === n.id, n.children.length > 0);
  });
  el.innerHTML = h;
}
function fltOpen(id){ fltStack.push(fltIndex[id]); renderFltSub(); }
function fltUp(){ fltStack.pop(); renderFltSub(); }
function fltPick(id){
  fltPending = id ? { id, label: subName(fltIndex[id]) } : { id:null, label:'' };
  renderFltSub();
}

function applySearchFilters(){
  const v = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
  currentCategoryId = fltCat;
  Object.assign(searchFilters, {
    subId: fltCat ? fltPending.id : null,
    subLabel: fltCat ? fltPending.label : '',
    city: v('fltCity'), priceMin: v('fltPmin'), priceMax: v('fltPmax'),
    type: fltCat === 4 ? v('fltType') : '',
  });
  closeSubpage();
  renderChips();
  runSearch();
}

/* Autocomplétion des villes présentes dans les annonces */
let adCityTimer = null;
function bindAdCityAutocomplete(inputId, listId){
  const inp = document.getElementById(inputId), dl = document.getElementById(listId);
  if(!inp || !dl) return;
  inp.addEventListener('input', () => {
    clearTimeout(adCityTimer);
    const v = inp.value.trim();
    if(v.length < 2){ dl.innerHTML = ''; return; }
    adCityTimer = setTimeout(async () => {
      try{
        const r = await fetch(API_BASE + '/api_cities.php?q=' + encodeURIComponent(v));
        const d = await r.json();
        dl.innerHTML = (d.cities || []).map(c => `<option value="${escapeHtml(c)}">`).join('');
      }catch(e){}
    }, 250);
  });
}

async function submitForgot(){
  const email = document.getElementById('fEmail').value.trim();
  const msg = document.getElementById('fMsg');
  msg.style.color = '#dc2626'; msg.textContent = '';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return msg.textContent = t('err.email');

  const btn = document.getElementById('fBtn');
  btn.disabled = true; btn.textContent = t('pd.sending');
  try{
    const data = await apiFetch('/api_forgot_password.php', {method:'POST', body: JSON.stringify({email})});
    if(data.success){
      document.getElementById('subpageBody').innerHTML = `
        <div style="text-align:center;padding:24px 4px;">
          <div style="font-size:46px;">📧</div>
          <h3 style="margin:10px 0 8px;">Vérifiez vos emails</h3>
          <p style="color:#555;font-size:14.5px;line-height:1.5;">${escapeHtml(data.message)}<br><br><b>Pensez à vérifier votre dossier spam.</b></p>
          <button class="btn" style="margin-top:18px;" onclick="openResetPassword()">Saisir le lien reçu</button>
          <button class="btn ghost" style="margin-top:10px;" onclick="closeSubpage()">Retour à la connexion</button>
        </div>`;
    } else {
      msg.textContent = data.error || t('pd.fail');
      btn.disabled = false; btn.textContent = 'Envoyer le lien';
    }
  }catch(e){
    msg.textContent = t('net.error');
    btn.disabled = false; btn.textContent = 'Envoyer le lien';
  }
}

function openResetPassword(){
  openSubpage('Nouveau mot de passe', 'reset');
  document.getElementById('subpageBody').innerHTML = `
    <p style="color:#555;font-size:14px;line-height:1.5;margin:0 0 16px;">Collez ici le lien reçu par email (ou son code), puis choisissez un nouveau mot de passe.</p>
    <div class="field"><label>Lien ou code reçu par email *</label><textarea id="rTok" rows="2" placeholder="https://www.ozannonces.ma/...token=..."></textarea></div>
    <div class="field"><label>Nouveau mot de passe * (8 caractères min.)</label><input id="rNewPass" type="password"></div>
    <div class="field"><label>Confirmer le mot de passe *</label><input id="rNewPass2" type="password"></div>
    <div id="rsMsg" style="color:#dc2626;font-size:13px;margin-bottom:10px;"></div>
    <button class="btn" id="rsBtn" onclick="submitResetPassword()">Modifier mon mot de passe</button>
  `;
}

// Accepte le lien complet collé (…?token=xxx) ou le token seul
function extractResetToken(raw){
  const s = (raw || '').trim();
  const m = s.match(/[?&]token=([^&\s#]+)/i);
  return m ? decodeURIComponent(m[1]) : s;
}

async function submitResetPassword(){
  const token = extractResetToken(document.getElementById('rTok').value);
  const pass = document.getElementById('rNewPass').value;
  const pass2 = document.getElementById('rNewPass2').value;
  const msg = document.getElementById('rsMsg');
  msg.textContent = '';
  if(!token) return msg.textContent = 'Collez le lien reçu par email.';
  if(pass.length < 8) return msg.textContent = t('err.pass8');
  if(pass !== pass2) return msg.textContent = t('err.pass_match');

  const btn = document.getElementById('rsBtn');
  btn.disabled = true; btn.textContent = 'Modification…';
  try{
    const data = await apiFetch('/api_reset_password.php', {method:'POST', body: JSON.stringify({
      token, password: pass, confirm_password: pass2
    })});
    if(data.success){
      document.getElementById('subpageBody').innerHTML = `
        <div style="text-align:center;padding:24px 4px;">
          <div style="font-size:46px;">✅</div>
          <h3 style="margin:10px 0 8px;">Mot de passe modifié</h3>
          <p style="color:#555;font-size:14.5px;line-height:1.5;">${escapeHtml(data.message)}</p>
          <button class="btn" style="margin-top:18px;" onclick="closeSubpage();go('profil')">Se connecter</button>
        </div>`;
    } else {
      msg.textContent = data.error || t('common.err');
      btn.disabled = false; btn.textContent = 'Modifier mon mot de passe';
    }
  }catch(e){
    msg.textContent = t('net.error');
    btn.disabled = false; btn.textContent = 'Modifier mon mot de passe';
  }
}

async function loadProfil(){
  const el = document.getElementById('profilContent');
  try{
    const res = await fetch(API_BASE + '/api_me.php', { credentials: 'include' });
    const data = await res.json();
    if(data.success && data.logged_in){
      renderProfilLoggedIn(data.user);
    } else {

    }

}

  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  try{
    const res = await fetch(API_BASE + '/api_login.php', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if(data.success){
  if(data.session_id) localStorage.setItem('oz_sid', data.session_id); // ← indispensable
  renderProfilLoggedIn(data.user);
  await checkAuth();
  if(pendingDetailId){ const id = pendingDetailId; pendingDetailId = null; openDetailById(id); }
} else {
      errEl.textContent = data.error || t('auth.login_error');
    }
  }catch(e){
    errEl.textContent = t('auth.net');
  }
}

async function logout(){
  try{ await fetch(API_BASE + '/api_logout.php', { credentials: 'include' }); }catch(e){}
  localStorage.removeItem('oz_sid');
  pendingDetailId = null;
  renderProfilLoggedOut();
  currentUser = null;
  resetDeposer();
  updateDeposerGate();
}

// Chargement initial : catégories, annonces de l'accueil, état de connexion
function applyNode(r){
  if(!r || r.nodeType !== 1) return;
  [r, ...r.querySelectorAll('[data-i18n],[data-i18n-ph]')].forEach(el => {
    if(el.dataset.i18n){ const v = t(el.dataset.i18n); if(el.textContent !== v) el.textContent = v; }
    if(el.dataset.i18nPh){ const v = t(el.dataset.i18nPh); if(el.placeholder !== v) el.placeholder = v; }
  });
}
new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(applyNode))).observe(document.body, {childList:true, subtree:true});
applyI18n();
renderOza();
loadCategories();
loadListings(null, 'homeList');
checkAuth();
const h = location.hash.replace('#','');
if(['deposer','annonces'].includes(h)) go(h);
// Retour depuis la page de paiement : lien direct vers « Mes annonces »
if(h === 'mes-annonces'){
  history.replaceState(null, '', location.pathname + location.search);
  if(localStorage.getItem('oz_sid')) openMesAnnonces();
}
